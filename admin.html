<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ადმინისტრატორი — ჯადოსნური ბუმბული</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f0ff;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 28px;
      border-radius: 18px;
      width: min(85%, 360px);
      text-align: center;
      box-shadow: 0 4px 20px #0001;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 9px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    button {
      background: #a77bd1;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #message { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>ჯადოსნური ბუმბული ✨</h2>
    <h3>ადმინისტრატორის შესვლა</h3>

    <input id="email" type="email" placeholder="ელფოსტა">
    <input id="password" type="password" placeholder="პაროლი">
    <button onclick="login()">შესვლა</button>

    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL = " https://nraykxancxojrvmcxsvj.supabase.co ";
    const SUPABASE_KEY = " sb_publishable_nh4gN8C_bVbe7AZ8yuaGlg_SL8Rb7Vz  ";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "ვამოწმებ...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        message.textContent = "შესვლა ვერ მოხერხდა: " + error.message;
        return;
      }

      const role = data.user.app_metadata?.role;

      if (role !== "admin") {
        await supabaseClient.auth.signOut();
        message.textContent = "ადმინისტრატორის უფლება არ გაქვს.";
        return;
      }

      message.textContent = "წარმატებით შეხვედი! ❤️";
    }
  </script>
</body>
</html>
